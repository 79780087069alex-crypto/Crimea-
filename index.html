<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRIMEA-SPORT_TV</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'Fira Sans', sans-serif;
    background: linear-gradient(135deg, #0b0c10, #1f2833);
    color: #fff;
    overflow-x: hidden;
    position: relative;
}

/* Общие анимации с transform для оптимизации */
@keyframes glow {
    0% { text-shadow: 0 0 10px #45a29e, 0 0 20px #66fcf1; }
    100% { text-shadow: 0 0 20px #66fcf1, 0 0 40px #45a29e; }
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

@keyframes float {
    0% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(180deg); }
    100% { transform: translateY(0) rotate(360deg); }
}

/* Линии и вспышки через transform */
.line {
    position: absolute;
    width: 2px;
    height: 50px;
    background: rgba(102,252,241,0.6);
    opacity: 0.6;
    top: -60px;
    transform-origin: center;
    animation: moveLine 3s linear infinite;
}

@keyframes moveLine {
    0% { transform: translateY(-60px) rotate(0deg); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}

.flash {
    position: absolute;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: rgba(102,252,241,0.15);
    animation: flashPulse 4s ease-in-out infinite;
}

@keyframes flashPulse {
    0% { transform: scale(0.8); opacity: 0.1; }
    50% { transform: scale(1.2); opacity: 0.3; }
    100% { transform: scale(0.8); opacity: 0.1; }
}

/* Декоративные круги */
.decor {
    position: absolute;
    border-radius: 50%;
    opacity: 0.1;
    z-index: 1;
    animation: float 12s infinite ease-in-out;
    background: linear-gradient(45deg, #45a29e, #66fcf1);
}

/* Заголовок и текст */
header {
    text-align: center;
    padding: 60px 20px 30px;
    z-index: 2;
    position: relative;
}

header h1 {
    font-size: 2.5rem;
    color: #66fcf1;
    text-shadow: 0 0 15px #45a29e, 0 0 30px #66fcf1;
    animation: glow 2s infinite alternate;
}

header p {
    margin-top: 10px;
    font-size: 1rem;
    color: #c5c6c7;
}

.sports-text {
    text-align: center;
    font-size: 1.2rem;
    color: #c5c6c7;
    margin: 20px auto;
    max-width: 900px;
    z-index: 2;
    position: relative;
}

/* Кнопки */
.cta-container {
    text-align: center;
    margin: 40px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
    z-index: 2;
    position: relative;
}

.cta-container a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px 45px;
    font-size: 1.3rem;
    font-weight: bold;
    color: #0b0c10;
    background: linear-gradient(90deg, #66fcf1, #45a29e);
    border-radius: 50px;
    text-decoration: none;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    overflow: hidden;
    animation: pulse 2s infinite;
}

.cta-container a img {
    width: 24px;
    height: 24px;
}

.cta-container a:hover {
    transform: scale(1.15) rotate(-1deg);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

/* Футер */
footer {
    text-align: center;
    padding: 30px 20px;
    background: #1f2833;
    color: #66fcf1;
    font-weight: bold;
    position: relative;
    z-index: 2;
}
</style>
</head>
<body>

<!-- Декоративные линии -->
<div class="line" style="left:10%; animation-duration: 3s;"></div>
<div class="line" style="left:30%; animation-duration: 4s;"></div>
<div class="line" style="left:60%; animation-duration: 5s;"></div>
<div class="line" style="left:80%; animation-duration: 3.5s;"></div>

<!-- Вспышки -->
<div class="flash" style="top:20%; left:15%;"></div>
<div class="flash" style="top:70%; left:70%;"></div>
<div class="flash" style="top:50%; left:50%;"></div>

<!-- Декоративные круги -->
<div class="decor" style="width:100px;height:100px;top:10%;left:15%;"></div>
<div class="decor" style="width:150px;height:150px;top:70%;right:10%;"></div>
<div class="decor" style="width:80px;height:80px;top:40%;left:50%;"></div>
<div class="decor" style="width:120px;height:120px;top:20%;right:40%;"></div>
<div class="decor" style="width:60px;height:60px;top:80%;left:20%;"></div>

<header>
    <h1>CRIMEA-SPORT_TV</h1>
    <p>Видео трансляции спортивных мероприятий</p>
</header>

<div class="sports-text">
    Бокс, Борьба, Кикбоксинг, Тхэквондо, АРБ, Гимнастика
</div>

<div class="cta-container">
    <a href="https://youtube.com/@crimeasportstv?si=CrqPHDp2Y6i4QqK1" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube"> Смотреть трансляцию
    </a>
    <a href="tel:+79780555970">
        📞 По вопросам и заказам звоните: +7 978 055 5970
    </a>
</div>

<footer>
    © 2025 CRIMEA-SPORT_TV
</footer>

<script>
/* Оптимизированная интерактивность через requestAnimationFrame */
const lines = document.querySelectorAll('.line');
const flashes = document.querySelectorAll('.flash');

let mouseX = window.innerWidth/2;
let mouseY = window.innerHeight/2;
let scrollY = window.scrollY;

document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
document.addEventListener('scroll', () => { scrollY = window.scrollY; });

function animate() {
    lines.forEach((line,i) => {
        const offset = (mouseX / window.innerWidth - 0.5) * 20 * (i+1);
        line.style.transform = `translateX(${offset}px)`;
    });
    flashes.forEach((flash,i) => {
        flash.style.transform = `translateY(${scrollY*0.05*(i+1)}px)`;
    });
    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
